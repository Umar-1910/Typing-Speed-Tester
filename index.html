<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Tester</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <div class="main">
        
        <h1 class="title">Typing Speed Tester</h1>

        <h2 class="time">01:00</h2>

        <p class="text">Loading...</p>    

        <textarea disabled class="type" rows="3" placeholder="Click Start and begin typing here..."></textarea>

        
        
        <div class="button">
            <button class="start">Start</button>
            <button class="restart">Restart</button>
        </div>

        
        
        <div class="panel panel-display">
            
            <h2 class="result">Your Result</h2>
            
            
            <div class="adjust">
                <div class="circle">
                    <p class="word">0</p>
                    <p class="wpm">W P M</p>
                    <span class=" level">Level</span>
                </div>
            </div>

            
            <div class="bar">
                <div>Accuracy</div>
                <div class="percentage">0%</div>
            </div>
            <div class="progress"></div>

            
            <div class="statistics">
                
                <div class="correctwords">
                    <p class="number">0</p>
                    <p class="subtitle">Correct Words</p>
                </div>
                
                <div class="mistakes">
                    <p class="number">0</p>
                    <p class="subtitle">Mistakes</p>
                </div>
                
                <div class="characterstyped">
                    <p class="number">0</p>
                    <p class="subtitle">Characters Typed</p>
                </div>
                
                <div class="timetaken">
                    <p class="number">0s</p>
                    <p class="subtitle">Time Taken</p>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
